[project]
name = "pr-summary-api"
version = "0.1.0"
description = "PR summary backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "anthropic",
    "pydantic-settings>=2.6",
    "google-genai>=3.5.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
